<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LineUp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #14171C; --card: #1E232B; --card2: #20262F;
    --accent: #F2A93B; --text: #EDEFF2; --muted: #9AA4B2; --border: #2A313C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100%;
  }
  body { padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 16px); }
  h1, h2 { font-family: 'Oswald', sans-serif; }

  #redirecting { max-width: 400px; margin: 70px auto; text-align: center; color: var(--muted); font-size: 14px; }

  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: 26px; margin: 0 0 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  header .sub {
    display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px;
    background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 999px;
  }
  header .sub::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block;
  }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 460px; margin: 0 auto 16px; }
  .kpi {
    background: var(--card); border-top: 3px solid var(--accent); border: 1px solid var(--border);
    border-top: 3px solid var(--accent); border-radius: 14px; padding: 18px 16px;
    width: 100%; text-align: left; font-family: inherit; cursor: pointer; color: var(--text);
  }
  .kpi.expanded { border-color: var(--accent); }
  .kpi .label { color: var(--muted); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .value { font-size: 32px; font-weight: 700; font-family: 'Oswald', sans-serif; color: var(--text); }

  #loading, #err { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  #err { color: #ff6b6b; }
  .refresh-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 9px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .panel {
    max-width: 460px; margin: 0 auto 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
  }
  .panel h2 {
    font-size: 15px; color: var(--text); font-weight: 600; margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .panel h2 .hint { color: var(--muted); font-size: 11px; text-transform: none; font-weight: 400; font-family: 'Work Sans', sans-serif; letter-spacing: normal; display: block; margin-top: 2px; }

  .risk-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .risk-row:last-child { border-bottom: none; }
  .risk-left { display: flex; align-items: center; gap: 10px; }
  .risk-right { text-align: right; }
  .risk-days { color: var(--accent); font-weight: 600; font-size: 13px; }
  .risk-action { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

  .belt-item { border-radius: 10px; background: var(--card2); margin-bottom: 8px; }
  .belt-item:last-child { margin-bottom: 0; }
  .belt-item.expanded { border: 1px solid var(--accent); }
  .belt-row {
    all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 14px; cursor: pointer; font-family: inherit;
  }
  .belt-left { display: flex; align-items: center; gap: 12px; }
  .belt-name { font-size: 15px; font-weight: 500; }
  .belt-count { font-size: 12px; color: var(--muted); }
  .belt-avg { font-size: 13px; color: var(--muted); font-weight: 600; }
  .belt-chevron { font-size: 18px; color: var(--muted); transition: transform 0.15s ease; }
  .belt-item.expanded .belt-chevron { transform: rotate(90deg); color: var(--accent); }

  .belt-roster {
    padding: 0 14px 14px; display: flex; flex-direction: column; gap: 7px;
    border-top: 1px solid var(--border); margin-top: 2px; padding-top: 10px;
  }
  .roster-row { display: flex; justify-content: space-between; font-size: 13.5px; }
  .roster-row .rname { color: var(--text); }
  .roster-row .rstatus { color: var(--muted); }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { all: unset; cursor: pointer; color: var(--muted); font-size: 17px; padding: 2px 8px; }
  .cal-nav:active { color: var(--accent); }
  .cal-label { font-size: 12px; color: var(--muted); }
  .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-weekdays { margin-bottom: 6px; }
  .cal-weekdays span { font-size: 10px; color: #6B7280; text-align: center; }
  .cal-day {
    all: unset; box-sizing: border-box; cursor: pointer; font-family: inherit;
    aspect-ratio: 1; border-radius: 6px; background: var(--card2);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted);
  }
  .cal-day.blank { background: transparent; cursor: default; }
  .cal-day.today { border: 2px solid var(--accent); }
  .cal-day.selected { box-shadow: 0 0 0 2px #fff inset; }
  .cal-legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 10px; }
  .cal-legend span.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .cal-legend span.lbl { font-size: 10px; color: #6B7280; }

  .cal-toggle-btn {
    flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card2); color: var(--muted); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .cal-toggle-btn.active { background: var(--accent); color: #14171C; border-color: var(--accent); }

  .bars-wrap { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bar-col .bar-val { font-size: 12px; font-weight: 600; }
  .bar-col .bar-fill { width: 100%; max-width: 30px; background: var(--accent); border-radius: 6px 6px 0 0; }
  .bar-col .bar-day { font-size: 11px; color: var(--muted); }
  .bar-col.peak .bar-day { color: var(--text); font-weight: 600; }
  .bar-col.peak .bar-val { color: var(--accent); font-weight: 700; }

  .lookup-wrap { position: relative; }
  .lookup-wrap input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text); font-size: 14px; font-family: inherit;
  }
  .search-results {
    display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px);
    background: var(--card2); border: 1px solid var(--border); border-radius: 10px;
    overflow-y: auto; max-height: 220px; z-index: 5;
  }
  .search-result {
    padding: 10px 14px; cursor: pointer; font-size: 14px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .search-result:last-child { border-bottom: none; }
  .search-result:active { background: var(--card); }
  .search-result .sr-left { display: flex; align-items: center; gap: 8px; }
  .search-result .sr-belt { color: var(--muted); font-size: 12px; }

  .member-detail-head { display: flex; align-items: center; justify-content: space-between; }
  .member-detail-name { font-family: 'Oswald', sans-serif; font-size: 17px; font-weight: 600; }
  .member-detail-meta { font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
  .clear-btn { all: unset; cursor: pointer; color: var(--muted); font-size: 12px; text-decoration: underline; }
  .visit-list { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
  .visit-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .visit-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="redirecting">Loading…</div>

<div id="dash" style="display:none;">
  <header>
    <h1 id="gymTitle">Gym Attendance</h1>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;">
      <div class="sub" id="lastUpdated">—</div>
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
      <button class="refresh-btn" id="signOutBtn">Sign out</button>
    </div>
  </header>

  <div id="loading">Loading…</div>
  <div id="err" style="display:none;"></div>

  <div id="content" style="display:none;">
    <div class="panel">
      <h2>Member lookup <span class="hint">Search a name to see their full check-in history</span></h2>
      <div class="lookup-wrap">
        <input id="memberSearch" type="text" placeholder="Search by name…" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div id="memberDetail" style="display:none; margin-top:14px;"></div>
    </div>

    <div class="kpis">
      <button type="button" class="kpi" data-kpi="today"><div class="label">Today</div><div class="value" id="kpiToday">0</div></button>
      <button type="button" class="kpi" data-kpi="week"><div class="label">This week</div><div class="value" id="kpiWeek">0</div></button>
      <button type="button" class="kpi" data-kpi="members"><div class="label">Total members</div><div class="value" id="kpiMembers">0</div></button>
      <button type="button" class="kpi" data-kpi="total"><div class="label">All-time check-ins</div><div class="value" id="kpiTotal">0</div></button>
    </div>

    <div class="panel" id="kpiDetailPanel" style="display:none;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <h2 style="margin:0;" id="kpiDetailTitle">Details</h2>
        <button type="button" class="clear-btn" id="kpiDetailClose">Close</button>
      </div>
      <div id="kpiDetailBody"></div>
    </div>

    <div class="panel" id="atRiskPanel" style="display:none;">
      <h2>At-risk members <span class="hint">10+ days away</span></h2>
      <div id="atRiskList"></div>
    </div>

    <div class="panel" id="calPanel" style="display:none;">
      <div class="cal-head">
        <h2 style="margin:0;">This month</h2>
        <span style="display:flex; align-items:center; gap:8px;">
          <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">&lsaquo;</button>
          <span class="cal-label" id="calLabel">—</span>
          <button type="button" class="cal-nav" id="calNext" aria-label="Next month">&rsaquo;</button>
        </span>
      </div>
      <div class="cal-weekdays">
        <span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span class="lbl">Fewer</span>
        <span class="sw" style="background:rgba(242,169,59,0.15)"></span>
        <span class="sw" style="background:rgba(242,169,59,0.4)"></span>
        <span class="sw" style="background:rgba(242,169,59,0.65)"></span>
        <span class="sw" style="background:rgba(242,169,59,0.95)"></span>
        <span class="lbl">More</span>
      </div>

      <div id="calDayDetail" style="display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--border);">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
          <h2 style="margin:0; font-size:13px;" id="calDayTitle">—</h2>
          <button type="button" class="clear-btn" id="calDayClose">Close</button>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <button type="button" class="cal-toggle-btn" id="calModeAttended" data-mode="attended">Attended</button>
          <button type="button" class="cal-toggle-btn" id="calModeAbsent" data-mode="absent">Not attended</button>
        </div>
        <div id="calDayBody"></div>
      </div>
    </div>

    <div class="panel" id="beltPanel" style="display:none;">
      <h2><span id="rankPanelTitle">Belt</span> breakdown <span class="hint" id="rankPanelHint">Tap a belt to see its students</span></h2>
      <div id="beltList"></div>
    </div>

    <div class="panel" id="weekdayPanel" style="display:none;">
      <h2>Busiest days <span class="hint">Total check-ins by weekday</span></h2>
      <div class="bars-wrap" id="weekdayBars"></div>
    </div>
  </div>
</div>

<script>
(function() {
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwE1ET6tuq1FyWYum6vPduf-6ZTq85Z36cU88dv2RiS0J60ZoTpgYHu_Hg-eL4Tg_KjrQ/exec";

  // Shared with login.html and gym-member-profile.html — same origin, same keys.
  const IDENTITY_KEY = 'gymAppIdentity';
  const SESSION_KEY = 'gymAppSessionKey';

  let gymName = null, sessionKey = null;

  // Each gym's app is called "[Gym Name] LineUp".
  function showAppName(gym) {
    const name = gym ? gym + ' LineUp' : 'LineUp';
    document.getElementById('gymTitle').textContent = name;
    document.title = name;
  }
  let expandedBelt = null;
  let expandedKpi = null;
  let calYear = null, calMonth = null, calDaysMap = {};
  let expandedDay = null;
  let calViewMode = 'attended';
  let allMembers = [];

  // Sign out: forget this person on this device completely.
  function signOut() {
    try { localStorage.removeItem(IDENTITY_KEY); sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    window.location.href = 'login.html';
  }

  // Session ended (expired, or this tab has none): keep who this device belongs to,
  // so they only have to enter their PIN again, not sign in from scratch.
  function backToUnlock() {
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
    window.location.href = 'login.html';
  }

  async function loadData() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('err').style.display = 'none';
    document.getElementById('content').style.display = 'none';

    const dataPromise = jsonpRequest(APPS_SCRIPT_URL, { mode: 'data', gymId: gymName, sessionKey: sessionKey });
    const membersPromise = jsonpRequest(APPS_SCRIPT_URL, { mode: 'members', gymId: gymName, sessionKey: sessionKey });

    try {
      const data = await dataPromise;
      if (data.error) {
        // Any error from a session-protected endpoint most likely means the
        // session has expired — the quickest fix is just unlocking again.
        backToUnlock();
        return;
      }
      render(data);
      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'Could not load data: ' + err.message;
    }

    try {
      const memberListResult = await membersPromise;
      if (memberListResult.members) allMembers = memberListResult.members;
    } catch (err) { /* search just won't have results if this fails */ }
  }

  function jsonpRequest(baseUrl, params) {
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Request timed out. Check your connection and try again'));
      }, 20000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = (data) => { cleanup(); resolve(data); };

      const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
      const script = document.createElement('script');
      script.src = baseUrl + (baseUrl.includes('?') ? '&' : '?') + qs + '&callback=' + cbName;
      script.onerror = () => { cleanup(); reject(new Error('Could not reach the script URL')); };
      document.body.appendChild(script);
    });
  }

  // Wording and colours come from the gym's rows in the Google Sheet (Gyms and Ranks
  // tabs), so changing them never needs a code change. These are only the defaults.
  let labels = { rank: 'Belt', member: 'Students' };
  let rankColours = {};   // lower-case rank name -> colour set in the Ranks tab

  // Plain colour words work with no setup at all.
  const COMMON_COLOURS = {
    white: '#F5F5F0', yellow: '#F5C400', orange: '#F57C00', green: '#2E9E4F', blue: '#2F6FED',
    purple: '#8B5CF6', brown: '#8B5E34', red: '#D93025', pink: '#EC6FA8', grey: '#8A8F98',
    gray: '#8A8F98', black: '#111111', gold: '#D4A017', silver: '#B8BCC4'
  };
  const UNSET_COLOUR = '#6B7280';

  function esc(text) {
    return String(text === null || text === undefined ? '' : text).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function resolveColour(value) {
    const v = String(value || '').trim();
    if (/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v)) return v;
    return COMMON_COLOURS[v.toLowerCase()] || null;
  }

  // Very light or very dark dots get a thin outline so they stay visible on either theme.
  function needsOutline(hex) {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.85 || lum < 0.12;
  }

  function beltStyle(beltName) {
    const key = (beltName || '').toLowerCase().trim();
    const hex = resolveColour(rankColours[key]) || resolveColour(key) || UNSET_COLOUR;
    return { dot: hex, border: needsOutline(hex) };
  }

  function applyGymSettings(data) {
    if (data.labels) labels = { rank: data.labels.rank || 'Belt', member: data.labels.member || 'Students' };
    rankColours = {};
    (data.ranks || []).forEach(r => { if (r.colour) rankColours[String(r.rank).toLowerCase().trim()] = r.colour; });
    document.getElementById('rankPanelTitle').textContent = labels.rank;
    document.getElementById('rankPanelHint').textContent =
      'Tap a ' + labels.rank.toLowerCase() + ' to see its ' + labels.member.toLowerCase();
  }

  let lastData = null;

  function render(data) {
    applyGymSettings(data);
    lastData = data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    if (data.gymName) showAppName(data.gymName);
    document.getElementById('kpiToday').textContent = data.today || 0;
    document.getElementById('kpiWeek').textContent = data.week || 0;
    document.getElementById('kpiMembers').textContent = data.totalMembers || 0;
    document.getElementById('kpiTotal').textContent = data.totalCheckIns || 0;

    const atRiskPanel = document.getElementById('atRiskPanel');
    const atRiskList = document.getElementById('atRiskList');
    if (data.atRisk && data.atRisk.length) {
      atRiskPanel.style.display = 'block';
      atRiskList.innerHTML = data.atRisk.map(m =>
        `<div class="risk-row">
           <div class="risk-left">${m.name}</div>
           <div class="risk-right">
             <div class="risk-days">${m.daysSince}d away</div>
             <div class="risk-action">Send a check-in text</div>
           </div>
         </div>`
      ).join('');
    } else {
      atRiskPanel.style.display = 'none';
    }

    renderBeltList(data);

    if (data.calendarMonth) {
      calYear = data.calendarMonth.year;
      calMonth = data.calendarMonth.month;
      calDaysMap = data.calendarMonth.days || {};
      expandedDay = null;
      renderCalendar();
      renderCalDayDetail();
    }
    if (data.weekdayTotals) renderWeekdayBars(data.weekdayTotals);
    renderKpiDetail();
  }

  function renderBeltList(data) {
    const beltPanel = document.getElementById('beltPanel');
    const beltList = document.getElementById('beltList');
    if (!data.beltBreakdown || !data.beltBreakdown.length) {
      beltPanel.style.display = 'none';
      return;
    }
    beltPanel.style.display = 'block';

    beltList.innerHTML = data.beltBreakdown.map((b, i) => {
      const style = beltStyle(b.belt);
      const isOpen = expandedBelt === b.belt;
      const roster = (b.members || []).map(m =>
        `<div class="roster-row"><span class="rname">${m.name}</span><span class="rstatus">${m.label}</span></div>`
      ).join('');
      return `
        <div class="belt-item${isOpen ? ' expanded' : ''}">
          <button type="button" class="belt-row" data-idx="${i}">
            <span class="belt-left">
              <span class="dot" style="background:${style.dot};${style.border ? 'border:1px solid var(--border);' : ''}"></span>
              <span class="belt-name">${esc(b.belt)}</span>
              <span class="belt-count">${b.memberCount} ${esc(labels.member.toLowerCase())}</span>
            </span>
            <span class="belt-right" style="display:flex;align-items:center;gap:10px;">
              <span class="belt-avg">${b.avgVisits} avg</span>
              <span class="belt-chevron" aria-hidden="true">&rsaquo;</span>
            </span>
          </button>
          ${isOpen ? `<div class="belt-roster">${roster || '<div class="roster-row"><span class="rname" style="color:var(--muted)">No ${esc(labels.member.toLowerCase())} here yet</span></div>'}</div>` : ''}
        </div>`;
    }).join('');

    beltList.querySelectorAll('.belt-row').forEach(row => {
      row.addEventListener('click', () => {
        const b = data.beltBreakdown[parseInt(row.dataset.idx, 10)];
        expandedBelt = (expandedBelt === b.belt) ? null : b.belt;
        renderBeltList(data);
      });
    });
  }

  function renderKpiDetail() {
    const panel = document.getElementById('kpiDetailPanel');
    document.querySelectorAll('.kpi').forEach(btn => btn.classList.toggle('expanded', btn.dataset.kpi === expandedKpi));

    if (!expandedKpi || !lastData) { panel.style.display = 'none'; return; }
    panel.style.display = 'block';

    let title = '', rowsHtml = '';

    if (expandedKpi === 'today') {
      title = 'Checked in today';
      const list = (lastData.todayList || []);
      rowsHtml = list.length ? list.map(m => {
        const t = new Date(m.time);
        return `<div class="visit-row"><span class="rname">${m.name}</span><span class="rstatus">${t.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span></div>`;
      }).join('') : '<div style="color:var(--muted); font-size:13px;">No check-ins yet today.</div>';

    } else if (expandedKpi === 'week') {
      title = 'Attended this week';
      const list = (lastData.allMembers || []).filter(m => m.visitsThisWeek > 0)
        .sort((a, b) => b.visitsThisWeek - a.visitsThisWeek);
      rowsHtml = list.length ? list.map(m =>
        `<div class="visit-row"><span class="rname">${m.name}</span><span class="rstatus">${m.visitsThisWeek} visit${m.visitsThisWeek === 1 ? '' : 's'}</span></div>`
      ).join('') : '<div style="color:var(--muted); font-size:13px;">No check-ins yet this week.</div>';

    } else if (expandedKpi === 'members') {
      title = 'All members';
      const list = (lastData.allMembers || []).slice().sort((a, b) => a.name.localeCompare(b.name));
      rowsHtml = list.length ? list.map(m =>
        `<div class="visit-row"><span class="rname">${m.name} <span style="color:var(--muted); font-size:12px;">(${m.belt})</span></span><span class="rstatus">${m.totalVisits} all-time</span></div>`
      ).join('') : '<div style="color:var(--muted); font-size:13px;">No members recorded yet.</div>';

    } else if (expandedKpi === 'total') {
      title = 'All-time check-ins by member';
      const list = (lastData.allMembers || []).filter(m => m.totalVisits > 0)
        .sort((a, b) => b.totalVisits - a.totalVisits);
      rowsHtml = list.length ? list.map(m =>
        `<div class="visit-row"><span class="rname">${m.name}</span><span class="rstatus">${m.totalVisits}</span></div>`
      ).join('') : '<div style="color:var(--muted); font-size:13px;">No check-ins recorded yet.</div>';
    }

    document.getElementById('kpiDetailTitle').textContent = title;
    document.getElementById('kpiDetailBody').innerHTML = `<div class="visit-list" style="max-height:320px;">${rowsHtml}</div>`;
  }

  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function dateKey(y, m, d) {
    return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  }

  function renderCalendar() {
    document.getElementById('calPanel').style.display = 'block';
    document.getElementById('calLabel').textContent = MONTH_NAMES[calMonth] + ' ' + calYear;

    const firstDay = new Date(calYear, calMonth, 1);
    const leading = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const counts = Object.values(calDaysMap).map(names => names.length);
    const maxCount = counts.length ? Math.max(...counts) : 0;

    const todayReal = new Date();
    const isCurrentMonth = todayReal.getFullYear() === calYear && todayReal.getMonth() === calMonth;

    let html = '';
    for (let i = 0; i < leading; i++) html += '<span class="cal-day blank"></span>';
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dateKey(calYear, calMonth, d);
      const count = (calDaysMap[key] || []).length;
      let style = '';
      if (count > 0 && maxCount > 0) {
        const opacity = (0.25 + (count / maxCount) * 0.75).toFixed(2);
        style = `background: rgba(242,169,59,${opacity});`;
        if (opacity >= 0.9) style += 'color:#14171C;font-weight:700;';
      }
      const isToday = isCurrentMonth && d === todayReal.getDate();
      const isSelected = expandedDay === key;
      html += `<button type="button" class="cal-day${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}" data-day="${key}" style="${style}">${d}</button>`;
    }
    document.getElementById('calGrid').innerHTML = html;

    document.querySelectorAll('.cal-day[data-day]').forEach(btn => {
      btn.addEventListener('click', () => {
        const day = btn.dataset.day;
        expandedDay = (expandedDay === day) ? null : day;
        renderCalendar();
        renderCalDayDetail();
      });
    });
  }

  function renderCalDayDetail() {
    const detailBox = document.getElementById('calDayDetail');
    if (!expandedDay) { detailBox.style.display = 'none'; return; }
    detailBox.style.display = 'block';

    const [y, m, d] = expandedDay.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    document.getElementById('calDayTitle').textContent =
      dateObj.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

    const attendedNames = calDaysMap[expandedDay] || [];
    const allNames = (lastData && lastData.allMembers) ? lastData.allMembers.map(m => m.name) : [];
    const absentNames = allNames.filter(n => !attendedNames.includes(n));

    document.getElementById('calModeAttended').classList.toggle('active', calViewMode === 'attended');
    document.getElementById('calModeAbsent').classList.toggle('active', calViewMode === 'absent');

    const list = calViewMode === 'attended' ? attendedNames : absentNames;
    const body = list.length
      ? list.map(n => `<div class="visit-row"><span class="rname">${n}</span></div>`).join('')
      : `<div style="color:var(--muted); font-size:13px;">${calViewMode === 'attended' ? 'No one checked in this day.' : 'Everyone checked in this day.'}</div>`;
    document.getElementById('calDayBody').innerHTML = `<div class="visit-list" style="max-height:260px;">${body}</div>`;
  }

  async function changeMonth(delta) {
    let newMonth = calMonth + delta, newYear = calYear;
    if (newMonth < 0) { newMonth = 11; newYear--; }
    if (newMonth > 11) { newMonth = 0; newYear++; }
    try {
      const result = await jsonpRequest(APPS_SCRIPT_URL, { mode: 'calendar', gymId: gymName, year: newYear, month: newMonth, sessionKey: sessionKey });
      if (result.error) throw new Error(result.error);
      calYear = result.year; calMonth = result.month; calDaysMap = result.days || {};
      expandedDay = null;
      renderCalendar();
      renderCalDayDetail();
    } catch (err) {
      // Silently ignore — the visible month just won't change if the request fails
    }
  }

  const WEEKDAY_LABELS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

  function renderWeekdayBars(weekdayTotals) {
    document.getElementById('weekdayPanel').style.display = 'block';
    const values = weekdayTotals.slice(0, 6);
    const max = Math.max(...values, 1);
    const peakIdx = values.indexOf(Math.max(...values));
    document.getElementById('weekdayBars').innerHTML = WEEKDAY_LABELS.map((label, i) => {
      const pct = Math.round((values[i] / max) * 100);
      return `<div class="bar-col${i === peakIdx ? ' peak' : ''}">
        <span class="bar-val">${values[i]}</span>
        <div class="bar-fill" style="height:${pct}%"></div>
        <span class="bar-day">${label}</span>
      </div>`;
    }).join('');
  }

  function renderSearchResults(matches) {
    const box = document.getElementById('searchResults');
    if (!matches.length) {
      box.style.display = 'block';
      box.innerHTML = '<div class="search-result" style="color:var(--muted); cursor:default;">No matches</div>';
      return;
    }
    box.style.display = 'block';
    box.innerHTML = matches.map(m => {
      const style = beltStyle(m.belt);
      return `<div class="search-result" data-id="${m.id}">
        <span class="sr-left">
          <span class="dot" style="background:${style.dot};${style.border ? 'border:1px solid var(--border);' : ''}"></span>
          ${m.name}
        </span>
        <span class="sr-belt">${esc(m.belt)}</span>
      </div>`;
    }).join('');
    box.querySelectorAll('.search-result[data-id]').forEach(row => {
      row.addEventListener('click', () => selectMember(row.dataset.id));
    });
  }

  async function selectMember(id) {
    document.getElementById('searchResults').style.display = 'none';
    document.getElementById('memberSearch').value = '';
    const detailBox = document.getElementById('memberDetail');
    detailBox.style.display = 'block';
    detailBox.innerHTML = '<div style="color:var(--muted); font-size:13px;">Loading…</div>';
    try {
      const result = await jsonpRequest(APPS_SCRIPT_URL, { mode: 'profile', id: id, sessionKey: sessionKey });
      if (result.sessionExpired) { backToUnlock(); return; }
      if (result.error) throw new Error(result.error);
      renderMemberDetail(result);
    } catch (err) {
      detailBox.innerHTML = '<div style="color:#ff6b6b; font-size:13px;">Could not load this member\'s history.</div>';
    }
  }

  function renderMemberDetail(result) {
    const member = result.member;
    const style = beltStyle(member.belt);
    const visits = (result.visits || [])
      .map(v => new Date(v))
      .filter(d => !isNaN(d))
      .sort((a, b) => b - a);

    const shown = visits.slice(0, 40);
    const rows = shown.map(d =>
      `<div class="visit-row">
         <span>${d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</span>
         <span style="color:var(--muted);">${d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })}</span>
       </div>`
    ).join('');

    document.getElementById('memberDetail').innerHTML = `
      <div class="member-detail-head">
        <span class="sr-left" style="gap:10px;">
          <span class="dot" style="background:${style.dot};${style.border ? 'border:1px solid var(--border);' : ''}"></span>
          <span class="member-detail-name">${member.name}</span>
        </span>
        <button type="button" class="clear-btn" id="clearMemberBtn">Clear</button>
      </div>
      <div class="member-detail-meta">${esc((result.labels && result.labels.rank) || labels.rank)}: ${esc(member.belt)} &middot; ${visits.length} total check-in${visits.length === 1 ? '' : 's'}</div>
      <div class="visit-list">${rows || '<div style="color:var(--muted); font-size:13px;">No check-ins recorded yet.</div>'}</div>
      ${visits.length > 40 ? `<div style="font-size:11px; color:var(--muted); margin-top:8px;">Showing the 40 most recent of ${visits.length}</div>` : ''}
    `;
    document.getElementById('clearMemberBtn').addEventListener('click', () => {
      const box = document.getElementById('memberDetail');
      box.style.display = 'none';
      box.innerHTML = '';
    });
  }

  function init() {
    // This page trusts login.html entirely — it never signs anyone in itself.
    // No remembered identity, wrong role, or no session key for this tab = straight back.
    let identity = null;
    try { identity = JSON.parse(localStorage.getItem(IDENTITY_KEY)); } catch (e) { identity = null; }
    try { sessionKey = sessionStorage.getItem(SESSION_KEY); } catch (e) { sessionKey = null; }

    if (!identity || identity.role !== 'Coach') {
      signOut();
      return;
    }
    if (!sessionKey) {
      backToUnlock();
      return;
    }

    gymName = identity.gymId;
    document.getElementById('redirecting').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    showAppName(identity.gymName || gymName);
    loadData();
  }

  document.getElementById('refreshBtn').addEventListener('click', () => { expandedBelt = null; loadData(); });
  document.getElementById('signOutBtn').addEventListener('click', signOut);
  document.getElementById('calPrev').addEventListener('click', () => changeMonth(-1));
  document.getElementById('calNext').addEventListener('click', () => changeMonth(1));

  document.getElementById('calDayClose').addEventListener('click', () => {
    expandedDay = null;
    renderCalendar();
    renderCalDayDetail();
  });
  document.getElementById('calModeAttended').addEventListener('click', () => { calViewMode = 'attended'; renderCalDayDetail(); });
  document.getElementById('calModeAbsent').addEventListener('click', () => { calViewMode = 'absent'; renderCalDayDetail(); });

  document.querySelectorAll('.kpi[data-kpi]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.kpi;
      expandedKpi = (expandedKpi === key) ? null : key;
      renderKpiDetail();
    });
  });
  document.getElementById('kpiDetailClose').addEventListener('click', () => {
    expandedKpi = null;
    renderKpiDetail();
  });

  document.getElementById('memberSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const box = document.getElementById('searchResults');
    if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
    renderSearchResults(allMembers.filter(m => m.name.toLowerCase().includes(q)).slice(0, 8));
  });

  setInterval(() => {
    if (gymName && sessionKey) loadData();
  }, 15 * 60 * 1000);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && gymName && sessionKey) loadData();
  });

  init();
})();
</script>

</body>
</html>
