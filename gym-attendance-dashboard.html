<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171C; --card: #1E232B; --card2: #20262F;
    --accent: #F2A93B; --text: #EDEFF2; --muted: #9AA4B2; --border: #2A313C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100%;
  }
  body { padding: env(safe-area-inset-top, 20px) 16px calc(env(safe-area-inset-bottom, 20px) + 16px); }
  h1, h2 { font-family: 'Oswald', sans-serif; }

  #setup { max-width: 400px; margin: 70px auto; text-align: center; }
  #setup h1 { font-size: 22px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  #setup p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  #setup input {
    width: 100%; padding: 14px 16px; border-radius: 12px; margin-bottom: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px;
    font-family: inherit;
  }
  #setup button {
    padding: 14px 28px; border-radius: 12px; border: none; width: 100%;
    background: var(--accent); color: #14171C; font-weight: 700; font-size: 15px; cursor: pointer;
    font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.5px;
  }

  header { text-align: center; margin-bottom: 24px; }
  header h1 {
    font-size: 26px; margin: 0 0 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
  }
  header .sub {
    display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px;
    background: var(--card); border: 1px solid var(--border); padding: 6px 14px; border-radius: 999px;
  }
  header .sub::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block;
  }

  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 460px; margin: 0 auto 16px; }
  .kpi {
    background: var(--card); border-top: 3px solid var(--accent); border: 1px solid var(--border);
    border-top: 3px solid var(--accent); border-radius: 14px; padding: 18px 16px;
  }
  .kpi .label { color: var(--muted); font-size: 11px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .kpi .value { font-size: 32px; font-weight: 700; font-family: 'Oswald', sans-serif; }

  #loading, #err { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  #err { color: #ff6b6b; }
  .refresh-wrap { text-align: center; margin-top: 20px; }
  .refresh-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 9px 18px; border-radius: 10px; font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .panel {
    max-width: 460px; margin: 0 auto 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
  }
  .panel h2 {
    font-size: 15px; color: var(--text); font-weight: 600; margin: 0 0 12px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .panel h2 .hint { color: var(--muted); font-size: 11px; text-transform: none; font-weight: 400; font-family: 'Work Sans', sans-serif; letter-spacing: normal; display: block; margin-top: 2px; }

  .risk-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .risk-row:last-child { border-bottom: none; }
  .risk-left { display: flex; align-items: center; gap: 10px; }
  .risk-right { text-align: right; }
  .risk-days { color: var(--accent); font-weight: 600; font-size: 13px; }
  .risk-action { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; display: inline-block; }

  .belt-item { border-radius: 10px; background: var(--card2); margin-bottom: 8px; }
  .belt-item:last-child { margin-bottom: 0; }
  .belt-item.expanded { border: 1px solid var(--accent); }
  .belt-row {
    all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center;
    justify-content: space-between; padding: 12px 14px; cursor: pointer; font-family: inherit;
  }
  .belt-left { display: flex; align-items: center; gap: 12px; }
  .belt-name { font-size: 15px; font-weight: 500; }
  .belt-count { font-size: 12px; color: var(--muted); }
  .belt-avg { font-size: 13px; color: var(--muted); font-weight: 600; }
  .belt-chevron { font-size: 18px; color: var(--muted); transition: transform 0.15s ease; }
  .belt-item.expanded .belt-chevron { transform: rotate(90deg); color: var(--accent); }

  .belt-roster {
    padding: 0 14px 14px; display: flex; flex-direction: column; gap: 7px;
    border-top: 1px solid var(--border); margin-top: 2px; padding-top: 10px;
  }
  .roster-row { display: flex; justify-content: space-between; font-size: 13.5px; }
  .roster-row .rname { color: var(--text); }
  .roster-row .rstatus { color: var(--muted); }
</style>
</head>
<body>

<div id="setup">
  <h1>Attendance Dashboard</h1>
  <p>Paste your Apps Script URL and gym name once — saved on this device only.</p>
  <input id="urlInput" type="url" placeholder="https://script.google.com/macros/s/XXXX/exec" autocomplete="off" autocapitalize="off" spellcheck="false">
  <input id="gymInput" type="text" placeholder="Gym ID (e.g. g1)" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button id="saveBtn">Load Dashboard</button>
</div>

<div id="dash" style="display:none;">
  <header>
    <h1 id="gymTitle">Gym Attendance</h1>
    <div class="sub" id="lastUpdated">—</div>
  </header>

  <div id="loading">Loading…</div>
  <div id="err" style="display:none;"></div>

  <div id="content" style="display:none;">
    <div class="kpis">
      <div class="kpi"><div class="label">Today</div><div class="value" id="kpiToday">0</div></div>
      <div class="kpi"><div class="label">This week</div><div class="value" id="kpiWeek">0</div></div>
      <div class="kpi"><div class="label">Total members</div><div class="value" id="kpiMembers">0</div></div>
      <div class="kpi"><div class="label">All-time check-ins</div><div class="value" id="kpiTotal">0</div></div>
    </div>

    <div class="panel" id="atRiskPanel" style="display:none;">
      <h2>At-risk members <span class="hint">10+ days away</span></h2>
      <div id="atRiskList"></div>
    </div>

    <div class="panel" id="beltPanel" style="display:none;">
      <h2>Belt breakdown <span class="hint">Tap a belt to see its students</span></h2>
      <div id="beltList"></div>
    </div>

    <div class="refresh-wrap">
      <button class="refresh-btn" id="refreshBtn">Refresh</button>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'gymDashboardUrl';
  const GYM_KEY = 'gymDashboardGym';
  let baseUrl = null, gymName = null;
  let expandedBelt = null; // which belt row is currently drilled into, if any

  async function loadData() {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('err').style.display = 'none';
    document.getElementById('content').style.display = 'none';
    try {
      const data = await jsonpRequest(baseUrl, { mode: 'data', gymId: gymName });
      if (data.error) throw new Error(data.error);
      render(data);
      document.getElementById('lastUpdated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      const e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'Could not load data: ' + err.message;
    }
  }

  function jsonpRequest(baseUrl, params) {
    return new Promise((resolve, reject) => {
      const cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Request timed out — check the script URL is correct'));
      }, 12000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = (data) => { cleanup(); resolve(data); };

      const qs = Object.keys(params).map(k => k + '=' + encodeURIComponent(params[k])).join('&');
      const script = document.createElement('script');
      script.src = baseUrl + (baseUrl.includes('?') ? '&' : '?') + qs + '&callback=' + cbName;
      script.onerror = () => { cleanup(); reject(new Error('Could not reach the script URL')); };
      document.body.appendChild(script);
    });
  }

  const BELT_COLORS = {
    white: { dot: '#F5F5F0', border: true },
    blue: { dot: '#2F6FED' },
    purple: { dot: '#8B5CF6' },
    brown: { dot: '#8B5E34' },
    black: { dot: '#111111', border: true },
    unspecified: { dot: '#6B7280' }
  };
  function beltStyle(beltName) {
    const key = (beltName || '').toLowerCase().trim();
    return BELT_COLORS[key] || BELT_COLORS.unspecified;
  }

  let lastData = null; // keep the last successful payload so re-render (on tap) needs no re-fetch

  function render(data) {
    lastData = data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    if (data.gymName) document.getElementById('gymTitle').textContent = data.gymName;
    document.getElementById('kpiToday').textContent = data.today || 0;
    document.getElementById('kpiWeek').textContent = data.week || 0;
    document.getElementById('kpiMembers').textContent = data.totalMembers || 0;
    document.getElementById('kpiTotal').textContent = data.totalCheckIns || 0;

    // At-risk members
    const atRiskPanel = document.getElementById('atRiskPanel');
    const atRiskList = document.getElementById('atRiskList');
    if (data.atRisk && data.atRisk.length) {
      atRiskPanel.style.display = 'block';
      atRiskList.innerHTML = data.atRisk.map(m =>
        `<div class="risk-row">
           <div class="risk-left">${m.name}</div>
           <div class="risk-right">
             <div class="risk-days">${m.daysSince}d away</div>
             <div class="risk-action">Send a check-in text</div>
           </div>
         </div>`
      ).join('');
    } else {
      atRiskPanel.style.display = 'none';
    }

    renderBeltList(data);
  }

  // Renders the belt list, expanding whichever belt is in `expandedBelt` (if any)
  // with its real member roster — no extra request needed, the roster came with getDashboardData.
  function renderBeltList(data) {
    const beltPanel = document.getElementById('beltPanel');
    const beltList = document.getElementById('beltList');
    if (!data.beltBreakdown || !data.beltBreakdown.length) {
      beltPanel.style.display = 'none';
      return;
    }
    beltPanel.style.display = 'block';

    beltList.innerHTML = data.beltBreakdown.map((b, i) => {
      const style = beltStyle(b.belt);
      const isOpen = expandedBelt === b.belt;
      const roster = (b.members || []).map(m =>
        `<div class="roster-row"><span class="rname">${m.name}</span><span class="rstatus">${m.label}</span></div>`
      ).join('');
      return `
        <div class="belt-item${isOpen ? ' expanded' : ''}">
          <button type="button" class="belt-row" data-idx="${i}">
            <span class="belt-left">
              <span class="dot" style="background:${style.dot};${style.border ? 'border:1px solid var(--border);' : ''}"></span>
              <span class="belt-name">${b.belt}</span>
              <span class="belt-count">${b.memberCount} students</span>
            </span>
            <span class="belt-right" style="display:flex;align-items:center;gap:10px;">
              <span class="belt-avg">${b.avgVisits} avg</span>
              <span class="belt-chevron" aria-hidden="true">&rsaquo;</span>
            </span>
          </button>
          ${isOpen ? `<div class="belt-roster">${roster || '<div class="roster-row"><span class="rname" style="color:var(--muted)">No students in this belt yet</span></div>'}</div>` : ''}
        </div>`;
    }).join('');

    beltList.querySelectorAll('.belt-row').forEach(row => {
      row.addEventListener('click', () => {
        const b = data.beltBreakdown[parseInt(row.dataset.idx, 10)];
        expandedBelt = (expandedBelt === b.belt) ? null : b.belt;
        renderBeltList(data); // re-render just the belt list — instant, no network call
      });
    });
  }

  function init() {
    const params = new URLSearchParams(window.location.search);
    baseUrl = params.get('url');
    gymName = params.get('gymId');
    if (!baseUrl) { try { baseUrl = localStorage.getItem(STORAGE_KEY); } catch (e) { baseUrl = null; } }
    if (!gymName) { try { gymName = localStorage.getItem(GYM_KEY); } catch (e) { gymName = null; } }

    if (baseUrl && gymName) {
      document.getElementById('setup').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      document.getElementById('gymTitle').textContent = gymName;
      loadData();
    }
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const val = document.getElementById('urlInput').value.trim();
    const gym = document.getElementById('gymInput').value.trim();
    if (!val || !gym) return;
    try { localStorage.setItem(STORAGE_KEY, val); localStorage.setItem(GYM_KEY, gym); } catch (e) {}
    baseUrl = val; gymName = gym;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('dash').style.display = 'block';
    document.getElementById('gymTitle').textContent = gymName;
    loadData();
  });
  document.getElementById('refreshBtn').addEventListener('click', () => { expandedBelt = null; loadData(); });

  // Auto-refresh: every 15 minutes while the page is open, no button press needed
  setInterval(() => {
    if (baseUrl && gymName) loadData();
  }, 15 * 60 * 1000);

  // Also refresh whenever the tab/phone screen comes back into view
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && baseUrl && gymName) loadData();
  });

  init();
})();
</script>

</body>
</html>
